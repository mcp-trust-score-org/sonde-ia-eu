# Fournisseurs d'API d'IA hébergés en Europe, tous compatibles OpenAI.
# Adresses vérifiées dans la documentation officielle de chaque fournisseur (novembre 2026).
# La clé de chaque fournisseur est lue dans la variable d'environnement `cle_env`.
# Un fournisseur sans clé est simplement ignoré.

fournisseurs:
  - id: mistral
    nom: Mistral AI
    pays: FR
    base_url: https://api.mistral.ai/v1
    cle_env: MISTRAL_API_KEY

  - id: scaleway
    nom: Scaleway Generative APIs
    pays: FR
    # Projet par défaut. Pour un autre projet : https://api.scaleway.ai/<PROJECT_ID>/v1
    base_url: https://api.scaleway.ai/v1
    cle_env: SCW_SECRET_KEY

  - id: ovhcloud
    nom: OVHcloud AI Endpoints
    pays: FR
    base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
    cle_env: OVH_AI_ENDPOINTS_ACCESS_TOKEN

  - id: ionos
    nom: IONOS AI Model Hub
    pays: DE
    base_url: https://openai.inference.de-txl.ionos.com/v1
    cle_env: IONOS_API_TOKEN

# Modèles "logiques" : le même modèle open-weight servi par plusieurs hébergeurs.
# Les catalogues changent souvent, donc on ne fige pas les identifiants :
# à chaque exécution, la sonde lit /v1/models et choisit l'identifiant qui correspond
# à l'un des `motifs` (comparaison insensible à la casse, aux points, tirets et soulignés).
# `exact` force un identifiant pour un fournisseur donné.

modeles:
  - id: mistral-small-3.2
    nom: Mistral Small 3.2 (24B)
    motifs: ["mistral-small-3.2", "mistral-small-2506"]
    # Exemple pour forcer un identifiant chez un fournisseur :
    # exact:
    #   mistral: mistral-small-2506

  - id: llama-3.3-70b
    nom: Llama 3.3 70B Instruct
    motifs: ["llama-3.3-70b-instruct", "llama-3.3-70b"]

  - id: gpt-oss-120b
    nom: gpt-oss 120B
    motifs: ["gpt-oss-120b"]

# Prix publics en euros par million de jetons, à recopier depuis la grille officielle
# de chaque fournisseur. Laissés vides, le coût n'est simplement pas calculé.
# Exemple :
#   scaleway:
#     llama-3.3-70b: {entree: 0.90, sortie: 0.90}
prix: {}

reglages:
  max_tokens: 300
  temperature: 0
  delai_connexion_s: 10
  delai_total_s: 60
  appels_simultanes_par_fournisseur: 2
