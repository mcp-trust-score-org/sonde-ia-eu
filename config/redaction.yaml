# Rédaction : les propositions d'articles préparées chaque jour par GitHub.
#
#   python -m sonde tendances   # sujets grand public et articles pour le Détour (public/tendances.json)
#   python -m sonde rediger     # brouillons du jour (redaction/propositions/AAAA-MM-JJ.md et .json)
#
# Les règles d'écriture sont dans redaction/CHARTE.md. Rien n'est publié sur le site.

# ---------------------------------------------------------------------------
# Rythme (jours : 0 = lundi … 6 = dimanche)
# ---------------------------------------------------------------------------
rythme:
  une:
    par_jour: 1
    bilan_le: 0                 # bilan de la semaine chaque lundi
  tous_connectes:
    jours: [0, 2, 4, 5]         # 4 sujets par semaine : lundi, mercredi, vendredi, samedi
    reflexe_de_la_semaine: 0    # le lundi
  detour:
    jours: [4]                  # le vendredi
    liens: 6
  candidats_affiches: 10        # sujets en réserve listés sous chaque proposition

# ---------------------------------------------------------------------------
# Le rédacteur : un modèle d'IA qui écrit les brouillons à partir des faits collectés,
# avec la charte en consigne. Format compatible OpenAI.
# Si aucun service ne répond, GitHub prépare des fiches (faits, sources, structure) à rédiger à la main.
# ---------------------------------------------------------------------------
redacteur:
  temperature: 0.4
  delai_s: 120
  essais: 2
  # Services essayés dans l'ordre. Un service dont la clé est absente est sauté.
  services:
    # 1. Mistral, si un jour le secret MISTRAL_API_KEY est renseigné.
    - nom: Mistral
      base_url: https://api.mistral.ai/v1
      cle_env: MISTRAL_API_KEY
      modeles: [mistral-medium-latest]
    # 2. GitHub Models : gratuit, sans clé à créer. Le workflow utilise son propre jeton
    #    (GITHUB_TOKEN, permission « models: read »). Quelques requêtes par minute.
    - nom: GitHub Models
      base_url: https://models.github.ai/inference
      cle_env: GITHUB_TOKEN
      modeles: [openai/gpt-4.1, openai/gpt-4o]
      pause_s: 8
      attente_429_s: 65
    # 3. OVHcloud AI Endpoints en accès anonyme : gratuit, hébergé en France, mais très demandé
    #    (2 requêtes par minute et par modèle, souvent saturé depuis les machines de GitHub).
    - nom: OVHcloud (anonyme)
      base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      sans_cle: true
      modeles: [Mistral-Small-3.2-24B-Instruct-2506, gpt-oss-120b, Meta-Llama-3_3-70B-Instruct]
      pause_s: 31
      attente_429_s: 65

# ---------------------------------------------------------------------------
# Lecture des articles : avant d'écrire, GitHub ouvre les articles de presse retenus et en donne
# le texte au rédacteur, comme source de faits à reformuler (jamais à recopier : un contrôle
# signale toute suite de 12 mots identiques). Les articles payants ou protégés restent non lus,
# et le brouillon le signale.
# ---------------------------------------------------------------------------
lecture:
  actif: true
  max_articles: 3              # par sujet
  max_caracteres: 6000         # par article
  min_caracteres: 400          # en dessous : article payant ou page protégée
  detour_caracteres: 1500      # début d'article lu pour écrire « pourquoi le lire »
  delai_s: 15

# ---------------------------------------------------------------------------
# Tous connectés : ce qui passionne les gens en ce moment. Pas de filtre par thème :
# le seul filtre est le test du « Et vous ? », appliqué au moment de la rédaction.
# ---------------------------------------------------------------------------
tendances:
  # Pages les plus lues de Wikipédia la veille (gratuit, public, sans clé).
  wikipedia:
    projets: [fr.wikipedia.org, en.wikipedia.org]
    nombre: 30
    # Pages toujours en tête, sans intérêt éditorial
    exclure: [Accueil, Main_Page, Wikipédia:Accueil_principal, Spécial:Recherche, Special:Search,
              Cleopatra, XXX, Pornhub, Xvideos, Deaths_in_2026, Décès_en_2026, Undefined]
  # Titres de la presse grand public, par flux RSS (tous les sujets : actu, culture, monde, tech).
  flux:
    - { nom: franceinfo,           url: "https://www.francetvinfo.fr/titres.rss" }
    - { nom: franceinfo Culture,   url: "https://www.francetvinfo.fr/culture.rss" }
    - { nom: franceinfo Internet,  url: "https://www.francetvinfo.fr/internet.rss" }
    - { nom: 20 Minutes,           url: "https://www.20minutes.fr/feeds/rss-une.xml" }
    - { nom: Le Monde,             url: "https://www.lemonde.fr/rss/une.xml" }
    - { nom: France 24,            url: "https://www.france24.com/fr/rss" }
    - { nom: BBC News,             url: "https://feeds.bbci.co.uk/news/rss.xml", langue: anglais }
  # GDELT en complément (désactivé : il refuse souvent les requêtes venues de GitHub).
  gdelt:
    actif: false
    mots: [panne, "rupture de stock", "file d'attente", piratage, arnaque, outage, scam]
    langues: [french, english]
    max_articles: 250
    pause_s: 6
    essais: 4
    attente_429_s: 30

# ---------------------------------------------------------------------------
# Le Détour : médias de référence. `chemin` restreint un grand site à une rubrique.
# ---------------------------------------------------------------------------
detour:
  jours: 7
  # Pour les médias généralistes, on ne garde que les articles dont le titre ou le résumé
  # contient l'un de ces mots. `tout: true` : média spécialisé, on garde tout.
  mots: [IA, intelligence artificielle, panne, cloud, données, numérique, internet, cyber, algorithme,
         plateforme, serveurs, électricité, câble, satellite, datacenter, centre de données, réseau,
         technologie, écran, application, smartphone, réseaux sociaux, AI, outage, data, chips, platform,
         algorithm, tech, internet, software, network]
  medias:
    - { nom: Next,               flux: "https://next.ink/feed/", tout: true }
    - { nom: Numerama,           flux: "https://www.numerama.com/feed/" }
    - { nom: Usbek & Rica,       flux: "https://usbeketrica.com/fr/rss" }      # adresse à confirmer au premier passage
    - { nom: Pixels (Le Monde),  flux: "https://www.lemonde.fr/pixels/rss_full.xml", tout: true }
    - { nom: Le Grand Continent, flux: "https://legrandcontinent.eu/fr/feed/" }
    - { nom: Reporterre,         flux: "https://reporterre.net/spip.php?page=backend-simple" }
    - { nom: Rest of World,      flux: "https://restofworld.org/feed/latest", langue: anglais, tout: true }
    - { nom: 404 Media,          flux: "https://www.404media.co/rss/", langue: anglais, tout: true }
    - { nom: Ars Technica,       flux: "https://feeds.arstechnica.com/arstechnica/index", langue: anglais }
    - { nom: The Register,       flux: "https://www.theregister.com/headlines.atom", langue: anglais, tout: true }

# ---------------------------------------------------------------------------
# Images : la catégorie de l'article choisit la photo de la banque (iris/assets/photos/).
# ---------------------------------------------------------------------------
images:
  ia: ia.jpg
  logiciel: logiciel.jpg
  reseau: reseau.jpg
  energie: energie.jpg
  meteo: energie.jpg
  cyberattaque: logiciel.jpg
  cloud: une-statue-arc.jpg
  jeux-video: jeux-video.jpg
  musique: pop-culture-concert.jpg
  cinema: pop-culture-cinema.jpg
  societe: societe.jpg
  sante: sante.jpg
  politique: politique.jpg
  medias: medias-tv.jpg
  savoir: savoir.jpg
  innovation: innovation.jpg
  autre: innovation.jpg
