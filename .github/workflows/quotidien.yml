name: Relevés quotidiens

on:
  schedule:
    - cron: "41 3 * * *"   # chaque jour à 3 h 41 UTC (4 h 41 à Paris en hiver) : brouillons prêts au réveil
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Un groupe par workflow : la veille, la mesure horaire et les relevés quotidiens
  # ne s'annulent plus entre eux (avant, les relevés quotidiens étaient annulés chaque jour).
  group: quotidien
  cancel-in-progress: false

jobs:
  releves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
      IONOS_API_TOKEN: ${{ secrets.IONOS_API_TOKEN }}
      POINT_DE_MESURE: "GitHub Actions (runner hébergé, région non garantie)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt opentimestamps-client cairosvg

      - name: Chemin réseau réel
        run: python -m sonde chemin
        continue-on-error: true

      - name: Empreinte des modèles
        run: python -m sonde empreinte
        continue-on-error: true

      - name: Dossiers de surveillance et brouillon du rapport
        run: |
          python -m sonde rapport --jours 7
          python -m sonde dossiers --jours 30
          python -m sonde rapport-public --jours 30

      - name: Avoirs et bulletin du matin
        if: vars.VEILLE_SERVEUR != 'oui'
        env:
          BULLETIN_SIGNATURE: ${{ vars.BULLETIN_SIGNATURE }}
          BULLETIN_ADRESSE: ${{ vars.BULLETIN_ADRESSE }}
        run: |
          python -m sonde avoirs
          python -m sonde avoirs --mois "$(date -u +%Y-%m)"
          python -m sonde meteo
          python -m sonde bulletin
        continue-on-error: true

      # Chaque commande a sa propre étape : si l'une échoue, les suivantes tournent quand même.
      - name: Actualités et croisement
        run: |
          python -m sonde actualites
          python -m sonde croiser
        continue-on-error: true
        timeout-minutes: 10

      - name: Tendances (Wikipédia, flux RSS)
        run: python -m sonde tendances
        continue-on-error: true
        timeout-minutes: 8

      - name: Marchés publics de l'IA (BOAMP, TED) pour le mercato
        continue-on-error: true
        run: python -m sonde marches

      - name: Propositions d'articles du jour (selon redaction/CHARTE.md, rien n'est publié)
        run: python -m sonde rediger
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
        # Le rédacteur s'arrête seul au bout de 15 minutes d'essais ; ceci n'est qu'un dernier garde-fou.
        # Les brouillons sont enregistrés au fil de l'eau : même coupé, le fichier du jour existe.
        timeout-minutes: 20

      - name: Preuves horodatées
        if: vars.VEILLE_SERVEUR != 'oui'
        run: python -m sonde horodater
        continue-on-error: true

      - name: Enregistrer
        run: |
          git config user.name "sonde-ia-eu"
          git config user.email "sonde-ia-eu@users.noreply.github.com"
          python -m sonde site || true   # données des onglets Premium du site (iris/donnees/)
          git add data public iris/donnees preuves dossiers rapports redaction
          git diff --cached --quiet || git commit -m "Relevés quotidiens $(date -u +%Y-%m-%d)"
          # Plusieurs workflows peuvent publier en même temps : on réessaie,
          # et en cas de conflit sur un fichier régénéré, notre version (la plus récente) l'emporte.
          for essai in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 7))
          done
          exit 1
