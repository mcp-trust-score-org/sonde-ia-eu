name: Veille (sans serveur)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mesure
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
      IONOS_API_TOKEN: ${{ secrets.IONOS_API_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ALERTE_WEBHOOK_URL: ${{ secrets.ALERTE_WEBHOOK_URL }}
      POINT_DE_MESURE: "GitHub Actions (région non garantie)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Veille, météo et alertes
        run: |
          python -m sonde veille
          python -m sonde direct
      - name: Enregistrer
        run: |
          git config user.name "sonde-ia-eu"
          git config user.email "sonde-ia-eu@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "Veille $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
