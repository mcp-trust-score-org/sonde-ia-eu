name: Publier un brouillon

# Actions → « Publier un brouillon » → Run workflow : un petit formulaire s'ouvre.
# Le brouillon choisi (redaction/propositions/<date>.md) passe sur le site Iris
# en une à deux minutes (Vercel republie le site après l'enregistrement).

on:
  workflow_dispatch:
    inputs:
      rubrique:
        description: "Rubrique du brouillon à publier"
        type: choice
        options: ["À la une", "Tous connectés", "Le Détour"]
        default: "À la une"
      date:
        description: "Date du brouillon (AAAA-MM-JJ). Vide = aujourd'hui"
        required: false
        default: ""
      numero:
        description: "S'il y a plusieurs brouillons dans la rubrique ce jour-là : lequel (1 = le premier)"
        required: false
        default: "1"
      liens:
        description: "Le Détour seulement : numéros des liens à garder, par exemple 1, 3, 4 (vide = tous)"
        required: false
        default: ""
      emplacement:
        description: "Où le placer sur le site"
        type: choice
        options: ["Grand titre", "Carte seulement"]
        default: "Grand titre"
      forcer:
        description: "Publier malgré un [À VÉRIFIER], un titre périmé ou un doublon"
        type: boolean
        default: false
      retirer:
        description: "Pour retirer du site au lieu de publier : cocher (retire le dernier article publié ; l'ancien grand titre reprend sa place)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publier (ou retirer)
        env:
          RUBRIQUE: ${{ inputs.rubrique }}
          DATE_BROUILLON: ${{ inputs.date }}
          NUMERO: ${{ inputs.numero }}
          LIENS: ${{ inputs.liens }}
          SITE_URL: https://sonde-ia-eu-iris.vercel.app   # en dur, comme veille, mesure et plus (la variable GitHub renvoyait vers une redirection)
        run: |
          case "$RUBRIQUE" in
            "À la une") R=une ;;
            "Tous connectés") R=tous_connectes ;;
            *) R=detour ;;
          esac
          if [ "${{ inputs.retirer }}" = "true" ]; then
            python -m sonde publier --retirer "dernier-$R"
          else
            python -m sonde publier --rubrique "$R" --date "$DATE_BROUILLON" --numero "${NUMERO:-1}" ${{ inputs.forcer && '--forcer' || '' }} ${{ inputs.emplacement == 'Carte seulement' && '--carte' || '' }} --liens "$LIENS"
          fi

      - name: Enregistrer (le site se met à jour tout seul)
        run: |
          git config user.name "sonde-ia-eu"
          git config user.email "sonde-ia-eu@users.noreply.github.com"
          git add iris/publies.json iris/flux.xml redaction/propositions
          if git diff --cached --quiet; then rm -f notification.json; exit 0; fi
          git commit -m "Publication : ${{ inputs.rubrique }} ${{ inputs.date }}"
          for essai in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1

      - name: Prévenir les abonnés (notification sur leur appareil)
        if: ${{ !inputs.retirer }}
        env:
          SITE_URL: https://sonde-ia-eu-iris.vercel.app   # en dur, comme veille, mesure et plus (la variable GitHub renvoyait vers une redirection)
          NOTIF_SECRET: ${{ secrets.NOTIF_SECRET }}
        run: |
          if [ -z "$NOTIF_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "Notifications pas encore configurées (SITE_URL ou NOTIF_SECRET absent) : rien envoyé."; exit 0
          fi
          if [ ! -f notification.json ]; then echo "Rien de nouveau publié : pas de notification."; exit 0; fi
          sleep 90   # le temps que Vercel mette l'article en ligne avant que les abonnés cliquent
          REPONSE=$(curl -sS -L --post301 --post302 --post303 --fail-with-body -X POST "${SITE_URL%/}/api/notifier" \
            -H "Authorization: Bearer $NOTIF_SECRET" -H "Content-Type: application/json" \
            --data @notification.json) || { echo "::warning::La notification n'est pas partie : $REPONSE"; exit 0; }
          echo "Réponse du site : $REPONSE"
          python3 - "$REPONSE" <<'PY'
          import json, sys
          try:
              r = json.loads(sys.argv[1])
          except ValueError:
              print("::warning::Le site n'a pas répondu comme prévu : notification probablement non envoyée."); sys.exit(0)
          print(f"Notification : {r.get('envoyes', 0)} appareil(s) prévenu(s) sur {r.get('abonnes', 0)} abonné(s), {r.get('echecs', 0)} échec(s).")
          if not r.get("envoyes"):
              print("::warning::Aucun appareil prévenu : vérifiez la cloche → « M'envoyer une notification d'essai » sur votre téléphone.")
          PY
