name: Mercato de l'IA

# Quand un mouvement est ajouté à iris/mercato.json (zip déposé ou fichier modifié sur GitHub), sa notification
# est préparée et attend le feu vert de la rédaction dans le pilotage (« À valider »). Le site n'est pas redéployé :
# l'encadré lit le fichier en direct (/d/mercato.json).
on:
  push:
    branches: [main]
    paths: ["iris/mercato.json"]
  workflow_dispatch: {}

permissions:
  contents: write   # les cartes partageables sont enregistrées dans iris/cartes/

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Un zip déposé arrive souvent en plusieurs envois : on attend la fin du dépôt, puis on prend la dernière
      # version du code ET du fichier. Sinon, le mercato peut être lu avec l'ancien code (26/11 : la signature des
      # Mousquetaires annoncée comme un départ).
      - name: Attendre la fin du dépôt
        run: sleep 120 && git pull --quiet origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Quels transferts sont nouveaux ?
        run: |
          AVANT="${{ github.event.before }}"
          if [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ]; then AVANT="HEAD~1"; fi
          git show "$AVANT:iris/mercato.json" > ancien.json 2>/dev/null || echo "" > ancien.json
          python -m sonde.mercato ancien.json iris/mercato.json > notification.json
          if [ -s notification.json ]; then echo "À envoyer :"; cat notification.json; else rm notification.json; echo "Aucun nouveau transfert (ou premier dépôt) : pas de notification."; fi
      - name: Proposer la notification à la rédaction (pilotage → À valider)
        env:
          SITE_URL: https://sonde-ia-eu-iris.vercel.app
          NOTIF_SECRET: ${{ secrets.NOTIF_SECRET }}
        run: |
          # Rien ne part vers les lecteurs : la notification attend le feu vert de la rédaction, qui est prévenue sur son téléphone.
          if [ ! -f notification.json ]; then exit 0; fi
          if [ -z "$NOTIF_SECRET" ]; then echo "NOTIF_SECRET absent : rien proposé."; exit 0; fi
          jq '{action: "proposer", item: .}' notification.json > proposition.json
          REPONSE=$(curl -sS -L --post301 --post302 --post303 --fail-with-body -X POST "${SITE_URL%/}/api/file" \
            -H "Authorization: Bearer $NOTIF_SECRET" -H "Content-Type: application/json" \
            --data @proposition.json) || { echo "::warning::La proposition n'est pas arrivée : $REPONSE"; exit 0; }
          echo "Réponse du site : $REPONSE"

      - name: Dessiner les cartes partageables (iris/cartes/)
        run: |
          python -m sonde.cartes
          git config user.name "sonde-ia-eu"
          git config user.email "sonde-ia-eu@users.noreply.github.com"
          git add iris/cartes
          git diff --cached --quiet && exit 0
          git commit -m "Cartes du mercato"
          for essai in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
